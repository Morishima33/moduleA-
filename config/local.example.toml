# 本机配置样例：复制为 config/local.toml 后按本机情况填写。local.toml 不提交到 git。
# 所有路径都可以省略，省略时使用默认值。

[paths]
# 新方案A05固定R工具（R包版本由科学进程核验）；不从浏览器接收路径
# science_rscript = "D:/R/R-4.4.1/bin/x64/Rscript.exe"
# 固定对接依赖所在只读目录，内含 environments/A06_python_runtime.json、Vina及P2Rank
# science_tools_root = "D:/科学工具目录"
# science_repair_packages = "D:/固定侧链修补依赖/packages"
# studies/ 与 references/ 所在目录；默认就是项目根目录
# data_root = "D:/codex-重大专项/moduleA"
# 后台科学计算使用的 Python（需已安装 networkx、python-docx、rdkit、meeko 等科学依赖）；默认与工作台相同
# science_python = "C:/Users/<用户名>/scoop/apps/python/current/python.exe"
# 预构建前端目录；默认 src/modulea/static
# static_dir = ""

[server]
# 前端开发服务器地址（仅开发时需要），例如 ["http://localhost:5173"]
allowed_origins = []

[resources]
# 同一runtime所有服务/worker须使用一致预算；不修改Vina/R等科学参数
compute_slots = 1
# 仅基础运行余量16MiB，不保证整个科学任务空间足够；按本机情况配置
compute_min_free_bytes = 16777216
