<rect x="180" y="916" width="1370" height="48" rx="11" fill="#A36E99" stroke="none" stroke-width="2"/>
<text x="865" y="940" text-anchor="middle" dominant-baseline="central" font-family="Microsoft YaHei,sans-serif" font-size="33" font-weight="700" fill="#FFFFFF">识别网络与功能</text>
